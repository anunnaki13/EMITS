[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Add backend/ to sys.path so `from tests.helpers.*` and `from tests.factories.*`
# imports resolve correctly at collection time (pytest 7.0+ feature).
pythonpath = .
markers =
    destructive: tests that delete or mutate production-shape data; gated by RUN_DESTRUCTIVE_TESTS=1
    slow: tests that take >5 seconds
addopts = --strict-markers -ra --asyncio-mode=auto
